# Real car on Levine. ROS 2 Jazzy, F1TENTH, D435i.
# Ament-python project: setup.py supplies the executable. No CMakeLists.txt needed.
ball_frenet_mpc_node:
  ros__parameters:
    odom_topic: "/pf/pose/odom"
    speed_topic: "/odom"
    ball_topic: "/ball/position"
    depth_topic: "/ball/camera_depth"
    scan_topic: "/scan"
    map_topic: "/map"
    drive_topic: "/drive"
    ball_frame: "rear_axle"
    global_frame: "map"
    odom_is_laser_pose: true
    lidar_offset_x: 0.27
    lidar_offset_y: 0.0
    lidar_yaw: 0.0
    waypoint_file: "levine_ball_path.csv"
    reference_is_ball_path: true   # Real track levine2: CSV is the ball-centre path
    solver_warm_start: true        # Preserve original real-car solver setting; requires testing
    wheelbase: 0.46
    max_steer: 0.4189
    ball_center_ahead: 0.540  # rear axle -> ball centre when touching (measure)
    max_speed: 0.5
    control_period: 0.1
    latency_compensation: 0.25
    enable_motion: false      # launch arg overrides when explicitly enabled
    reset_recovery: false
    contact_depth: 0.29      # D435i surface depth (optical axis), not rear_axle x
    depth_tolerance: 0.035
    lateral_release: 0.10    # 100 mm on either side
    sensor_timeout: 0.40
    reverse_speed: 0.12
    min_reverse: 0.20
    max_reverse: 0.90
    require_rear_lidar: true  # no rear coverage => HOLD, NEVER blind reverse
ball_detector_node:
  ros__parameters:
    cam_x: 0.29
    cam_y: 0.0
    cam_z: 0.18
    cam_pitch_deg: 30.0      # unverified: measure before driving
    h_min: 20
    h_max: 48
    s_min: 58
    v_min: 23
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    color_topic: "/camera/camera/color/image_raw"
    info_topic: "/camera/camera/color/camera_info"
