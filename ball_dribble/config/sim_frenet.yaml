# Gym on levine_blocked, NOT real-car levine2. Frenet MPC, NOT Stanley.
# Sim ball provides both /ball/position and synthetic /ball/camera_depth.
ball_sim_node:
  ros__parameters:
    odom_topic: "/ego_racecar/odom"
    map_topic: "/map"
    ball_topic: "/ball/position"
    global_frame: "map"
    odom_offset_x: 0.17      # Typical gym odometry centre ahead of rear axle; verify for your build
    ball_roll_decel: 0.35
    scoop_kind: "channel"
    start_ahead: 0.0
    camera_x: 0.15           # simulation camera, chosen to observe the scoop
    camera_min_range: 0.20
    camera_p_detect: 1.0    # deterministic visibility while testing control
    publish_synthetic_depth: true
    contact_depth: 0.29
    depth_topic: "/ball/camera_depth"
ball_frenet_mpc_node:
  ros__parameters:
    odom_topic: "/ego_racecar/odom"
    speed_topic: ""
    ball_topic: "/ball/position"
    depth_topic: "/ball/camera_depth"
    scan_topic: "/scan"
    map_topic: "/map"
    drive_topic: "/drive"
    global_frame: "map"
    ball_frame: "rear_axle"
    odom_is_laser_pose: false
    odom_offset_x: 0.17    # Match ball_sim_node correction; set both to 0 if odom is rear axle
    lidar_offset_x: 0.0    # Simulator scan origin can be changed after verifying frame
    lidar_offset_y: 0.0
    lidar_yaw: 0.0
    waypoint_file: "levine_ccw_raceline.csv"
    reference_is_ball_path: false  # Gym CSV is a vehicle raceline; no 0.54 m shift
    solver_warm_start: false       # Sim-only workaround for OSQP sparse update error
    wheelbase: 0.3302
    ball_center_ahead: 0.5081  # Matches channel scoop rider_x = apex + 0.033 m
    max_speed: 0.5
    max_steer: 0.4189
    control_period: 0.10
    latency_compensation: 0.0
    enable_motion: false
    contact_depth: 0.29
    depth_tolerance: 0.035
    lateral_release: 0.10
    sensor_timeout: 0.40
    reverse_speed: 0.12
    min_reverse: 0.20
    max_reverse: 0.90
    require_rear_lidar: false  # Simulation ONLY; NEVER use on the real car
    allow_direct_approach: true  # sim-only centred ball moving forward recovery

    # Simulated camera contact: require multiple good frames and tolerate a
    # brief depth bounce after re-contact. Physical vehicle remains strict.
    contact_confirm_time: 0.15
    contact_loss_grace: 0.30
    retry_depth_hold: true   # only safe forward retries for visible depth loss
