# Parameters for the real car. Use decimal points on every float.
ball_push_node:
  ros__parameters:
    odom_topic: "/pf/pose/odom"
    speed_topic: "/odom"
    odom_is_laser_pose: true
    lidar_offset_x: 0.27
    waypoint_file: "levine_ball_path.csv"   # built from levine2.yaml
    scoop_apex_x: 0.507        # measured: ball touching the claw reads 29 cm from the camera -> ball centre 0.54 m ahead of the rear axle
    max_speed: 0.5
    ball_roll_decel: 0.30      # PLACEHOLDER: measure with scripts/calibrate_ball.py, use ~0.8 x the result
ball_detector_node:
  ros__parameters:
    cam_x: 0.29                # measured: camera 29 cm ahead of the rear axle
    cam_y: 0.0
    cam_z: 0.18                # measured: 18 cm above the floor
    cam_pitch_deg: 30.0        # GUESS: must be measured (see the XYZ check) - it matters for every ball position
    h_min: 20                  # from the team's HSV sliders
    h_max: 48
    s_min: 58
    v_min: 23
